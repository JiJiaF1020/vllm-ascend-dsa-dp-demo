# Each vLLM worker embeds one LocalService and contributes 1 GiB DRAM.
# device_urma requires max.dram.size x world_size > 32 TiB to enable 56-bit
# GVA. The minimum practical envelope here is 1 TiB x 33 ranks = 33 TiB;
# only 1 GiB is physically allocated by each of the eight active workers.
ock.mmc.meta_service_url = tcp://127.0.0.1:5000
ock.mmc.local_service.config_store_url = tcp://127.0.0.1:6000
ock.mmc.log_level = info
ock.mmc.local_service.world_size = 33
ock.mmc.local_service.protocol = device_urma
ock.mmc.local_service.dram.size = 1GB
ock.mmc.local_service.max.dram.size = 1TB
ock.mmc.local_service.hbm.size = 0
ock.mmc.local_service.max.hbm.size = 0
